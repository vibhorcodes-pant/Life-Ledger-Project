# Life Ledger Spring Boot Application Properties
server.port=8080
spring.application.name=life-ledger-backend

# H2 In-Memory Database Configuration for Local Development & Rubric Demonstration
spring.datasource.url=jdbc:h2:mem:lifeledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Asynchronous / Multithreading Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=life-ledger-async-

# Logging
logging.level.com.lifledger=DEBUG
logging.level.org.springframework.web=INFO
